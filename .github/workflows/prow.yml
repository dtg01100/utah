name: Prow Transfer

on:
  issue_comment

jobs:
  transfer:
    needs: authorize
    if: needs.authorize.outputs.triage == 'true' && github.event_name == 'issue_comment'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
    - name: Use shared prow-transfer workflow
      uses: projectbluefin/.project/.github/workflows/prow-transfer.yml@db427290d0012fe4aabf63030d468ee2a71b3987
      with:
        authorized: ${{ needs.authorize.outputs.triage }}
        app-ref: db427290d0012fe4aabf63030d468ee2a71b3987
      secrets:
        MERGERAPTOR_APP_ID: ${{ secrets.MERGERAPTOR_APP_ID }}
        MERGERAPTOR_PRIVATE_KEY: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}