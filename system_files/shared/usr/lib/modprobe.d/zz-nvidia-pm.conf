# NVIDIA suspend / power-management quirk (projectbluefin/utah#492).
#
# Symptom: on utah-nvidia and utah-nvidia-gaming, requesting suspend (e.g.
# from the GNOME power menu) starts the system-sleep transaction, then the
# NVIDIA GSP firmware crashes. The kernel log shows the sequence
#
#     NVRM: nvAssertFailedNoLog: Assertion failed: ... @ kern_bus_vbar2.c:346
#     NVRM: kgspHealthCheck_TU102: * GSP-CrashCat Report *
#     NVRM: nvAssertFailedNoLog: Assertion failed: !pKernelGsp->bPollingForRpcResponse
#     NVRM: Xid (PCI:0000:01:00): 1, GSP task exception: load access fault
#     NVRM: gpuPowerManagementEnter: GSP unload failed at suspend: 0x65
#     NVRM: nvAssertFailedNoLog: Assertion failed: pKernelPmu->pPrintBuf == NULL
#     NVRM: gpuPowerManagementResume: cannot init libOS PMU logging structures
#     NVRM: Xid (PCI:0000:01:00): 119, Timeout after Ns of waiting for RPC ...
#     ---[ end trace ... ]---
#     BUG: unable to handle page fault for address: 00000000000026b0
#     Oops: 0000 [#1] SMP NOPTI
#     RIP: 0010:nvEvoDisableVblankSemControl+0x34/0xd0 [nvidia_modeset]
#     systemd-suspend.service: Main process exited, code=killed, status=9/KILL
#
# then nothing responds on the display; only a hard power-off recovers the
# machine.
#
# Root cause: NVreg_DynamicPowerManagement=0x02 (the default for Turing+ when
# GSP firmware is in use) drives the GPU into a deeper power-gated state at
# run-time and parks it there across the suspend transition. On Turing hardware
# with the 595.x open kernel modules that Utah builds from NVIDIA's `.run`
# installer, the GSP firmware aborts during the unload at suspend with
# Xid 1 / GSP task exception; subsequent RPCs hang (Xid 119, ~12 s); the
# nvidia_modeset resume path then dereferences a NULL pointer in
# nvEvoDisableVblankSemControl at +0x34 (offset 0x26b0 from the GPU object).
# The kernel oops kills systemd-suspend; the system wakes into a black
# console and the input subsystem never comes back. NVIDIA/open-gpu-kernel-modules
# #1271 tracks the same signature on RTX 4050 Mobile + 595.71.05; it is
# reproducible across RTX 30/40 Mobile on Fedora 44 with the same driver
# family (NVIDIA dev-forums GSP Xid 120 panic during s2idle suspend
# with NVreg_DynamicPowerManagement=0x02).
#
# Fix: NVreg_DynamicPowerManagement=0x01 keeps the GPU at the lighter
# power-gated state, which the GSP firmware can hand back across suspend
# without crashing. The trade-off is a small increase in idle GPU power
# draw (the GPU no longer drops into its deepest idle state); on a hybrid
# laptop the iGPU drives the display, so the user-visible cost is effectively
# nil on most machines. The option is honoured by every driver generation
# that exposes the parameter (Turing+) and is inert on systems without the
# nvidia module, so this file is safe in the shared layer for every flavor,
# including main and gaming which never load nvidia.
#
# zz- prefix: sorts after the driver packages' nvidia.conf and after
# common#1176's zz-nvidia-suspend.conf so this assignment wins any
# duplicate that a driver package might also set (last assignment in
# modprobe.d wins).
options nvidia NVreg_DynamicPowerManagement=0x01