# NVIDIA suspend / power-management quirk (projectbluefin/utah#492).
#
# Symptom: on utah-nvidia and utah-nvidia-gaming, requesting suspend (e.g.
# from the GNOME power menu) starts the system-sleep transaction, then the
# NVIDIA GSP firmware crashes. The kernel log shows the sequence
#
#     NVRM: nvAssertFailedNoLog: Assertion failed: ... @ kern_bus_vbar2.c:346
#     NVRM: kgspHealthCheck_TU102: * GSP-CrashCat Report *
#     NVRM: nvAssertFailedNoLog: Assertion failed: !pKernelGsp->bPollingForRpcResponse
#     NVRM: Xid (PCI:0000:01:00): 1, GSP task exception: load access fault
#     NVRM: gpuPowerManagementEnter: GSP unload failed at suspend: 0x65
#     NVRM: nvAssertFailedNoLog: Assertion failed: pKernelPmu->pPrintBuf == NULL
#     NVRM: gpuPowerManagementResume: cannot init libOS PMU logging structures
#     NVRM: Xid (PCI:0000:01:00): 119, Timeout after Ns of waiting for RPC ...
#     ---[ end trace ... ]---
#     BUG: unable to handle page fault for address: 00000000000026b0
#     Oops: 0000 [#1] SMP NOPTI
#     RIP: 0010:nvEvoDisableVblankSemControl+0x34/0xd0 [nvidia_modeset]
#     systemd-suspend.service: Main process exited, code=killed, status=9/KILL
#
# then nothing responds on the display; only a hard power-off recovers the
# machine.
#
# Root cause: with the 595.x open kernel modules that Utah builds from
# NVIDIA's `.run` installer, requesting suspend from the GNOME power menu
# starts the system-sleep transaction, then the GSP firmware aborts during
# the unload phase with Xid 1 / GSP task exception; subsequent RPCs hang
# (Xid 119, ~12 s); the nvidia_modeset resume path then dereferences a NULL
# pointer in nvEvoDisableVblankSemControl at +0x34 (offset 0x26b0 from the
# GPU object). The kernel oops kills systemd-suspend; the system wakes into
# a black console and the input subsystem never comes back (#492).
#
# NVIDIA's RTD3 documentation describes four values of the
# `NVreg_DynamicPowerManagement` driver parameter (Chapter 22, RTD3
# Power Management, 595.71.05):
#   0x00 — runtime D3 disabled; driver only uses built-in power
#          management (GPU always powered on).
#   0x01 — coarse-grained power control (lowest power state when no
#          NVIDIA application is running; GPU reactivated on demand).
#   0x02 — fine-grained power control (driver monitors GPU usage and
#          also powers the GPU down while a workload is idle, with
#          separate handling for video memory).
#   0x03 — the driver default. On Ampere-or-newer notebooks with
#          supported configurations this translates to 0x02
#          (fine-grained). On pre-Ampere notebooks and on all desktop
#          SKUs, 0x03 disables runtime D3 power management entirely.
# The reporter's hardware (#492) is a GTX 1650 Ti Mobile — a Turing
# notebook, which is pre-Ampere — so on that machine the default 0x03
# currently has runtime D3 disabled. Pinning 0x01 enables coarse-grained
# runtime D3: when no workload is using the GPU, the driver powers it
# down, and on the next wake / suspend cycle the GSP firmware tears
# down its own state before power-off rather than aborting mid-unload.
# This is a candidate workaround; reporter-side verification of
# suspend/resume with the option set on the actual hardware is owed
# before the fix is declared authoritative (see "Verification" in the PR).
#
# Trade-off: enabling coarse-grained RTD3 increases idle power draw
# marginally versus 0x03 (which has the feature off). On a hybrid laptop
# the iGPU drives the display, so the user-visible cost is effectively
# nil. The option is honoured by every driver generation that exposes
# the parameter (Turing+) and is inert on systems without the nvidia
# module, so this file is safe in the shared layer for every flavor,
# including main and gaming which never load nvidia.
#
# zz- prefix: sorts after the driver packages' nvidia.conf so this
# assignment wins any duplicate that a driver package might also set
# (last assignment in modprobe.d wins). The option does not overlap
# with common#1176's zz-nvidia-suspend.conf (which sets
# NVreg_UseKernelSuspendNotifiers=1 and NVreg_TemporaryFilePath=/var/tmp),
# so the relative ordering of the two files is moot for this parameter.
options nvidia NVreg_DynamicPowerManagement=0x01
