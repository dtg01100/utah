# / on an installed Utah system is a read-only composefs overlay (#585).
#
# systemd-remount-fs.service unconditionally tries to remount / read-write so
# systemd-tmpfiles and friends can stamp the filesystem. The upstream unit
# ships no Condition*, so on the composefs image the remount fails with
#
#   mount: /: fsconfig() failed: overlay: No changes allowed in reconfigure.
#
# and the unit exits 1. With nothing else wrong, that single failure leaves
# SystemState=degraded on every boot. StatusErrno=0 on the failed unit, so
# errno-keyed triage misses it; only UnitActiveState=failed + the journal
# show it.
#
# `ConditionPathIsReadWrite=` checks ST_RDONLY in statvfs(2). composefs
# mounts / read-only (`findmnt /` shows `composefs overlay ro,...`), so the
# condition fails and the unit is skipped -- never failed, never degraded.
# The writable-root bootc path (cf. iso/live/.../configure-live.sh,
# iso/scripts/build-iso.sh) does not mount / read-only, so the condition
# succeeds and the remount still runs there. A blanket mask would kill both
# paths; a condition keyed on the mount state keeps the writable path alive.
[Unit]
ConditionPathIsReadWrite=/
